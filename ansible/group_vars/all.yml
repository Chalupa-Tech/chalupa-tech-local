---
truenas_vm_ip: "192.168.1.40"
# Storage-subnet IP on vmbr1 — NFS clients should mount here so traffic
# bypasses vmbr0's gigabit cap and uses jumbo frames. The management
# IP (truenas_vm_ip) remains the canonical address for everything else
# (UI, API tokens, monitoring scrapes).
truenas_storage_ip: "10.10.10.40"

# Home Assistant OS image. Pinned for proxmox_prep download + decompress.
# Stays in sync with pulumi/Pulumi.proxmox.yaml -> chalupa-infra:haosVersion.
haos_version: "18.5"
# Filename and checksum derive from haos_version so a Renovate bump is a
# one-line change. At 18.2 the filename was still hard-pinned to 17.3, which
# would have 404'd Stage 1. The checksum is resolved by get_url from the
# release's multi-file SHA256SUMS asset (present from 18.4 onward).
haos_image_filename: "haos_ova-{{ haos_version }}.qcow2.xz"
haos_image_checksum: "sha256:https://github.com/home-assistant/operating-system/releases/download/{{ haos_version }}/SHA256SUMS"
