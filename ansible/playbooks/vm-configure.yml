---
# Play 1: Create the Plex LXC container on the Proxmox host.
# Runs as root on pve1 via SSH, which authenticates as root@pam —
# no API token restrictions on device passthrough or feature flags.
- name: Create Plex LXC container
  hosts: proxmox
  become: true
  roles:
    - plex_lxc

# Play 2: Configure software inside the Plex LXC container.
# gather_facts is disabled because the plex_server role starts with
# wait_for_connection (the LXC may still be booting after Play 1)
# followed by an explicit setup task to gather facts.
- name: Configure Plex Media Server LXC
  hosts: plex_servers
  become: true
  gather_facts: false
  roles:
    - plex_server
    - role: lxc_baseline
      vars:
        lxc_baseline_extra_origins:
          - "origin=Plex Media Server Repository"
        lxc_baseline_reboot_time: "04:30"

# Play 3: Baseline the Tailscale subnet-router LXC (VMID 100). The container
# itself was created by hand and stays that way (protection: 1); only its
# in-container patch policy is managed here. No SSH key lives inside it —
# the proxmox_pct_remote connection runs `pct exec` on pve1 over the
# existing root SSH session. Reboots at 04:45 drop the CI subnet route for
# about a minute, at a time no scheduled workflow runs.
- name: Configure Tailscale LXC
  hosts: tailscale_lxc
  gather_facts: false
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - role: lxc_baseline
      vars:
        lxc_baseline_extra_origins:
          - "origin=Tailscale"
        lxc_baseline_reboot_time: "04:45"
        lxc_baseline_tailscale_auto_update: true
