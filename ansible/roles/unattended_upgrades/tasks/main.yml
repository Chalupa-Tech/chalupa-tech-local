---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure unattended-upgrades origins and reboot policy
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Enable periodic apt update + unattended upgrade
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Ensure unattended-upgrades service is enabled
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    enabled: true
    state: started
  # In --check mode on a host that has never had the package the unit does
  # not exist yet; tolerate only in check mode (same guard as proxmox_prep).
  ignore_errors: "{{ ansible_check_mode }}"
