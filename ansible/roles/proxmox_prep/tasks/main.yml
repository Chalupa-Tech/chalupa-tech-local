# Tasks for preparing the Proxmox host (e.g., IOMMU, passthrough)
- name: Ensure Proxmox system is up to date
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist

- name: Ensure snippets directory exists on local storage
  ansible.builtin.file:
    path: /var/lib/vz/snippets
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Enable snippets content on local storage
  ansible.builtin.command: pvesm set local --content snippets,iso,vztmpl,backup
  changed_when: true

- name: Check if GRUB is used
  ansible.builtin.stat:
    path: /etc/default/grub
  register: proxmox_prep_grub_file

- name: Add IOMMU kernel parameters (GRUB)
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX_DEFAULT="(?!.*{{ proxmox_prep_cpu_vendor }}_iommu=on)(.*)"'
    line: 'GRUB_CMDLINE_LINUX_DEFAULT="\1 {{ proxmox_prep_cpu_vendor }}_iommu=on iommu=pt"'
    backrefs: true
  when: proxmox_prep_grub_file.stat.exists
  notify:
    - Update GRUB

- name: Check if systemd-boot is used
  ansible.builtin.stat:
    path: /etc/kernel/cmdline
  register: proxmox_prep_systemd_boot_file

- name: Add IOMMU kernel parameters (systemd-boot)
  ansible.builtin.lineinfile:
    path: /etc/kernel/cmdline
    line: "root=ZFS=rpool/ROOT/pve-1 boot=zfs {{ proxmox_prep_cpu_vendor }}_iommu=on iommu=pt"
  when: proxmox_prep_systemd_boot_file.stat.exists
  notify:
    - Refresh Proxmox boot tool

- name: Ensure VFIO kernel modules are loaded
  ansible.builtin.lineinfile:
    path: /etc/modules
    line: "{{ item }}"
    create: true
    mode: '0644'
  loop:
    - vfio
    - vfio_iommu_type1
    - vfio_pci
    - vfio_virqfd
  notify:
    - Update initramfs

# --- VFIO GPU cleanup (remove stale configs from abandoned passthrough branch) ---
- name: Remove stale GPU driver blacklist config
  ansible.builtin.file:
    path: /etc/modprobe.d/blacklist-gpu.conf
    state: absent
  when: not proxmox_prep_gpu_passthrough_enabled
  notify:
    - Update initramfs

- name: Remove stale vfio-pci device binding config
  ansible.builtin.file:
    path: /etc/modprobe.d/vfio-pci.conf
    state: absent
  when: not proxmox_prep_gpu_passthrough_enabled
  notify:
    - Update initramfs

- name: Remove initcall_blacklist from kernel parameters (GRUB)
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT=".*)\s+initcall_blacklist=sysfb_init(.*")'
    line: '\1\2'
    backrefs: true
  when:
    - not proxmox_prep_gpu_passthrough_enabled
    - proxmox_prep_grub_file.stat.exists
  notify:
    - Update GRUB

# --- Kernel 7 opt-in (pve-test repo) ---
- name: Enable pve-test repository for kernel 7
  ansible.builtin.apt_repository:
    repo: "deb http://download.proxmox.com/debian/pve trixie pve-test"
    filename: pve-test
    state: present
  when: proxmox_prep_kernel_7_enabled

- name: Install Proxmox kernel 7.0
  ansible.builtin.apt:
    name: proxmox-kernel-7.0
    state: present
    update_cache: true
  when: proxmox_prep_kernel_7_enabled
  notify:
    - Prompt reboot

- name: Pin kernel 7 as default boot kernel
  ansible.builtin.command: proxmox-boot-tool kernel pin 7.0
  register: proxmox_prep_kernel_pin
  changed_when: "'pinned' in proxmox_prep_kernel_pin.stdout"
  failed_when: proxmox_prep_kernel_pin.rc != 0
  when: proxmox_prep_kernel_7_enabled
  notify:
    - Refresh Proxmox boot tool

# --- LXC Container Template ---
- name: Check if Ubuntu LXC template already exists
  ansible.builtin.command: >
    pveam list {{ proxmox_prep_lxc_template_storage }}
  register: proxmox_prep_lxc_template_check
  changed_when: false

- name: Download Ubuntu 24.04 LTS container template
  ansible.builtin.command: >
    pveam download {{ proxmox_prep_lxc_template_storage }}
    {{ proxmox_prep_lxc_template_name }}
  when: proxmox_prep_lxc_template_name not in proxmox_prep_lxc_template_check.stdout
  changed_when: true

# --- Fedora Cloud Template Creation (VMID 9000) ---
- name: Check if Fedora cloud template already exists
  ansible.builtin.command: qm status {{ proxmox_prep_fedora_template_vmid }}
  register: proxmox_prep_fedora_template_check
  failed_when: false
  changed_when: false

- name: Create Fedora cloud template
  when: proxmox_prep_fedora_template_check.rc != 0
  block:
    - name: Download Fedora Cloud Base QCOW2
      ansible.builtin.get_url:
        url: "{{ proxmox_prep_fedora_cloud_image_url }}"
        dest: "{{ proxmox_prep_fedora_cloud_image_dest }}"
        checksum: "{{ proxmox_prep_fedora_cloud_image_checksum }}"
        mode: '0644'

    - name: Create template VM shell
      ansible.builtin.command: >
        qm create {{ proxmox_prep_fedora_template_vmid }}
        --name {{ proxmox_prep_fedora_template_name }}
        --memory 2048
        --net0 virtio,bridge=vmbr0
        --scsihw virtio-scsi-pci
        --bios ovmf
        --machine q35
        --agent enabled=1
        --serial0 socket
      changed_when: true

    - name: Add EFI disk to template
      ansible.builtin.command: >
        qm set {{ proxmox_prep_fedora_template_vmid }}
        --efidisk0 {{ proxmox_prep_fedora_template_storage }}:0,pre-enrolled-keys=0
      changed_when: true

    - name: Import QCOW2 as boot disk
      ansible.builtin.command: >
        qm set {{ proxmox_prep_fedora_template_vmid }}
        --scsi0 {{ proxmox_prep_fedora_template_storage }}:0,import-from={{ proxmox_prep_fedora_cloud_image_dest }}
      changed_when: true

    - name: Add cloud-init CD-ROM drive
      ansible.builtin.command: >
        qm set {{ proxmox_prep_fedora_template_vmid }}
        --ide2 {{ proxmox_prep_fedora_template_storage }}:cloudinit
      changed_when: true

    - name: Set boot order to scsi0
      ansible.builtin.command: >
        qm set {{ proxmox_prep_fedora_template_vmid }}
        --boot order=scsi0
      changed_when: true

    - name: Convert to template
      ansible.builtin.command: qm template {{ proxmox_prep_fedora_template_vmid }}
      changed_when: true

    - name: Remove temporary QCOW2 file
      ansible.builtin.file:
        path: "{{ proxmox_prep_fedora_cloud_image_dest }}"
        state: absent
