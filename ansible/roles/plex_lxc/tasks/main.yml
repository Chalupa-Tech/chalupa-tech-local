---
# ──────────────────────────────────────────────────────────
# Create and configure the Plex LXC container on the Proxmox host.
# Runs as root on pve1, so all pct operations authenticate as
# root@pam — no API token permission restrictions.
# ──────────────────────────────────────────────────────────

- name: Check if Plex LXC already exists
  ansible.builtin.command: pct status {{ plex_lxc_vmid }}
  register: plex_lxc_status
  failed_when: false
  changed_when: false

# ──────────────────────────────────────────────────────────
# Create the container if it doesn't exist
# ──────────────────────────────────────────────────────────
- name: Create Plex LXC container
  when: plex_lxc_status.rc != 0
  block:
    - name: Create container from Ubuntu template
      ansible.builtin.command: >
        pct create {{ plex_lxc_vmid }}
        {{ plex_lxc_ostemplate }}
        --hostname {{ plex_lxc_hostname }}
        --cores {{ plex_lxc_cores }}
        --memory {{ plex_lxc_memory }}
        --rootfs {{ plex_lxc_disk }}
        --net0 name=eth0,bridge=vmbr0,ip={{ plex_lxc_ip }}/24,gw={{ plex_lxc_gateway }}
        --nameserver "{{ plex_lxc_nameserver }}"
        --features nesting=1
        --onboot 1
        --startup order={{ plex_lxc_startup_order }}
        --unprivileged 0
      changed_when: true

    - name: Inject SSH public keys for root access
      ansible.builtin.copy:
        content: "{{ plex_lxc_ssh_keys }}"
        dest: "/var/lib/lxc/{{ plex_lxc_vmid }}/rootfs/root/.ssh/authorized_keys"
        mode: "0600"
        owner: root
        group: root

    - name: Ensure .ssh directory permissions
      ansible.builtin.file:
        path: "/var/lib/lxc/{{ plex_lxc_vmid }}/rootfs/root/.ssh"
        state: directory
        mode: "0700"
        owner: root
        group: root

# ──────────────────────────────────────────────────────────
# Ensure required settings on existing containers.
# These run every time (idempotent) to catch containers
# created by older Pulumi runs without these settings.
# ──────────────────────────────────────────────────────────
- name: Read LXC config
  ansible.builtin.slurp:
    src: "/etc/pve/lxc/{{ plex_lxc_vmid }}.conf"
  register: plex_lxc_conf

- name: Ensure container is privileged
  when: "'unprivileged: 1' in (plex_lxc_conf.content | b64decode)"
  block:
    - name: Stop container to change privileged mode
      ansible.builtin.command: pct stop {{ plex_lxc_vmid }}
      changed_when: true
      failed_when: false

    - name: Set unprivileged to 0
      ansible.builtin.lineinfile:
        path: "/etc/pve/lxc/{{ plex_lxc_vmid }}.conf"
        regexp: "^unprivileged: 1"
        line: "unprivileged: 0"
      notify: Restart Plex LXC

- name: Ensure nesting is enabled
  ansible.builtin.command: pct set {{ plex_lxc_vmid }} --features nesting=1
  when: "'nesting=1' not in (plex_lxc_conf.content | b64decode)"
  changed_when: true
  notify: Restart Plex LXC

- name: Ensure GPU render device passthrough
  ansible.builtin.command: >
    pct set {{ plex_lxc_vmid }}
    -dev0 {{ plex_lxc_gpu_device }},mode=0666
  when:
    - plex_lxc_gpu_device is defined
    - "'dev0:' not in (plex_lxc_conf.content | b64decode)"
  changed_when: true
  notify: Restart Plex LXC

- name: Get current LXC config
  ansible.builtin.command: pct config {{ plex_lxc_vmid }}
  register: plex_lxc_config_output
  changed_when: false

- name: Resize rootfs if smaller than configured size
  ansible.builtin.command: >
    pct resize {{ plex_lxc_vmid }} rootfs {{ plex_lxc_disk | regex_replace('.*:', '') }}G
  when: (plex_lxc_config_output.stdout | regex_search('size=(\d+)G') | regex_replace('[^0-9]', '') | int) < (plex_lxc_disk | regex_replace('.*:', '') | int)
  changed_when: true

# ──────────────────────────────────────────────────────────
# Flush handlers so any restart happens before Play 2
# ──────────────────────────────────────────────────────────
- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Ensure Plex LXC is started
  ansible.builtin.command: pct start {{ plex_lxc_vmid }}
  register: plex_lxc_start
  changed_when: plex_lxc_start.rc == 0
  failed_when:
    - plex_lxc_start.rc != 0
    - "'already running' not in plex_lxc_start.stderr"
