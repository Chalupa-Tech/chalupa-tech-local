---
# ──────────────────────────────────────────────────────────
# 1. Wait for LXC to be reachable via SSH
# ──────────────────────────────────────────────────────────
- name: Wait for LXC to be reachable
  ansible.builtin.wait_for_connection:
    delay: 5
    timeout: 300

# ──────────────────────────────────────────────────────────
# 2. Gather system facts (needed for ansible_os_family, etc.)
# ──────────────────────────────────────────────────────────
- name: Gather facts
  ansible.builtin.setup:

# ──────────────────────────────────────────────────────────
# 3. Create personal user with sudo access
# ──────────────────────────────────────────────────────────
- name: Create personal user
  ansible.builtin.user:
    name: "{{ plex_server_user }}"
    groups: sudo
    append: true
    shell: /bin/bash
    create_home: true

- name: Add SSH authorized key for personal user
  ansible.posix.authorized_key:
    user: "{{ plex_server_user }}"
    key: "{{ plex_server_ssh_key }}"
    state: present

- name: Grant passwordless sudo to sudo group
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/sudo-nopasswd
    line: "%sudo ALL=(ALL) NOPASSWD: ALL"
    create: true
    mode: "0440"
    validate: "visudo -cf %s"

# ──────────────────────────────────────────────────────────
# 4. Install VA-API drivers for GPU hardware transcoding
#    Requires /dev/dri/renderD128 passed through from host
# ──────────────────────────────────────────────────────────
- name: Install VA-API drivers for AMD GPU
  ansible.builtin.apt:
    name:
      - mesa-va-drivers
      - libva2
      - vainfo
    state: present
    update_cache: true

# ──────────────────────────────────────────────────────────
# 5. Install NFS client utilities
# ──────────────────────────────────────────────────────────
- name: Install nfs-common
  ansible.builtin.apt:
    name: nfs-common
    state: present

# ──────────────────────────────────────────────────────────
# 6. Create NFS mount points and mount shares
#    Uses x-systemd.automount so the LXC won't hang at boot
#    if TrueNAS is temporarily unreachable.
# ──────────────────────────────────────────────────────────
- name: Create Plex media mount points  # noqa: risky-file-permissions
  ansible.builtin.file:
    path: "{{ item.dest }}"
    state: directory
  loop: "{{ plex_server_nfs_shares }}"

- name: Mount TrueNAS NFS shares
  ansible.posix.mount:
    src: "{{ plex_server_nfs_server }}:{{ item.src }}"
    path: "{{ item.dest }}"
    fstype: nfs
    opts: "defaults,_netdev,nofail,x-systemd.automount,x-systemd.device-timeout=10s"
    state: mounted
  loop: "{{ plex_server_nfs_shares }}"

# ──────────────────────────────────────────────────────────
# 7. Add Plex Media Server DEB repository
# ──────────────────────────────────────────────────────────
- name: Download Plex repository GPG key
  ansible.builtin.get_url:
    url: "{{ plex_server_repo_gpgkey }}"
    dest: /usr/share/keyrings/PlexSign.asc
    mode: "0644"

- name: Add Plex DEB repository
  ansible.builtin.apt_repository:
    repo: "{{ plex_server_repo_url }}"
    filename: plexmediaserver
    state: present

# ──────────────────────────────────────────────────────────
# 8. Install Plex Media Server
# ──────────────────────────────────────────────────────────
- name: Install plexmediaserver
  ansible.builtin.apt:
    name: plexmediaserver
    state: present
    update_cache: true
  notify: Restart plexmediaserver

# ──────────────────────────────────────────────────────────
# 9. Grant plex user GPU and media access
#    - video + render groups: access to /dev/dri devices
#    - personal user group: read access to NFS-mounted media
# ──────────────────────────────────────────────────────────
- name: Add plex user to GPU and media groups
  ansible.builtin.user:
    name: plex
    groups:
      - video
      - render
      - "{{ plex_server_user }}"
    append: true
  notify: Restart plexmediaserver

# ──────────────────────────────────────────────────────────
# 10. Firewall — open port 32400/tcp (Plex Web UI + streaming)
# ──────────────────────────────────────────────────────────
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow Plex port through ufw
  community.general.ufw:
    rule: allow
    port: '32400'
    proto: tcp

- name: Enable ufw
  community.general.ufw:
    state: enabled

# ──────────────────────────────────────────────────────────
# 11. Enable and start Plex
# ──────────────────────────────────────────────────────────
- name: Enable and start plexmediaserver
  ansible.builtin.systemd:
    name: plexmediaserver
    enabled: true
    state: started
