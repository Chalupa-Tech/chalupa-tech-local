---
# ──────────────────────────────────────────────────────────
# 1. Wait for LXC to be reachable via SSH
# ──────────────────────────────────────────────────────────
- name: Wait for LXC to be reachable
  ansible.builtin.wait_for_connection:
    delay: 5
    timeout: 300

# ──────────────────────────────────────────────────────────
# 2. Gather system facts (needed for ansible_os_family, etc.)
# ──────────────────────────────────────────────────────────
- name: Gather facts
  ansible.builtin.setup:

# ──────────────────────────────────────────────────────────
# 3. Install dependencies
# ──────────────────────────────────────────────────────────
- name: Install dependencies
  ansible.builtin.apt:
    name:
      - curl
      - sudo
      - gnupg2
    state: present
    update_cache: true

# ──────────────────────────────────────────────────────────
# 4. Create personal user with sudo access
# ──────────────────────────────────────────────────────────
- name: Create personal user
  ansible.builtin.user:
    name: "{{ plex_server_user }}"
    groups: sudo
    append: true
    shell: /bin/bash
    create_home: true

- name: Add SSH authorized key for personal user
  ansible.posix.authorized_key:
    user: "{{ plex_server_user }}"
    key: "{{ plex_server_ssh_key }}"
    state: present

- name: Grant passwordless sudo to sudo group
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/sudo-nopasswd
    line: "%sudo ALL=(ALL) NOPASSWD: ALL"
    create: true
    mode: "0440"
    validate: "visudo -cf %s"

# ──────────────────────────────────────────────────────────
# 5. Set up hardware acceleration (AMD VA-API)
#    Adapted from tteck/Proxmox Plex script for AMD iGPU
# ──────────────────────────────────────────────────────────
- name: Install VA-API drivers for AMD GPU
  ansible.builtin.apt:
    name:
      - mesa-va-drivers
      - libva2
      - vainfo
    state: present

- name: Set /dev/dri device permissions
  ansible.builtin.file:
    path: /dev/dri
    group: video
    mode: "0755"

- name: Set /dev/dri device node permissions
  ansible.builtin.shell: chmod 660 /dev/dri/*
  changed_when: true

- name: Add root user to video and render groups
  ansible.builtin.user:
    name: root
    groups:
      - video
      - render
    append: true

# ──────────────────────────────────────────────────────────
# 6. Install NFS client utilities and mount shares
#    Uses x-systemd.automount so the LXC won't hang at boot
#    if TrueNAS is temporarily unreachable.
# ──────────────────────────────────────────────────────────
- name: Install nfs-common
  ansible.builtin.apt:
    name: nfs-common
    state: present

- name: Create Plex media mount points  # noqa: risky-file-permissions
  ansible.builtin.file:
    path: "{{ item.dest }}"
    state: directory
  loop: "{{ plex_server_nfs_shares }}"

- name: Mount TrueNAS NFS shares
  ansible.posix.mount:
    src: "{{ plex_server_nfs_server }}:{{ item.src }}"
    path: "{{ item.dest }}"
    fstype: nfs
    opts: "defaults,_netdev,nofail,x-systemd.automount,x-systemd.device-timeout=10s"
    state: mounted
  loop: "{{ plex_server_nfs_shares }}"

# ──────────────────────────────────────────────────────────
# 7. Add Plex Media Server DEB repository
#    Per official Plex docs: https://support.plex.tv/articles/235974187
# ──────────────────────────────────────────────────────────
- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Remove old Plex repo config if present
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/share/keyrings/PlexSign.asc
    - /etc/apt/sources.list.d/plexmediaserver.list

- name: Download Plex GPG key
  ansible.builtin.get_url:
    url: "{{ plex_server_repo_gpgkey }}"
    dest: /tmp/PlexSign.v2.key
    mode: "0644"

- name: Dearmor Plex GPG key
  ansible.builtin.command: gpg --yes --dearmor -o {{ plex_server_repo_keyring }} /tmp/PlexSign.v2.key
  args:
    creates: "{{ plex_server_repo_keyring }}"

- name: Add Plex DEB repository
  ansible.builtin.apt_repository:
    repo: "{{ plex_server_repo_url }}"
    filename: plex
    state: present

# ──────────────────────────────────────────────────────────
# 8. Install Plex Media Server
#    --force-confold preserves existing config on upgrades
# ──────────────────────────────────────────────────────────
- name: Install plexmediaserver
  ansible.builtin.apt:
    name: plexmediaserver
    state: present
    update_cache: true
    dpkg_options: "force-confold"
  notify: Restart plexmediaserver

# ──────────────────────────────────────────────────────────
# 9. Fix render group GID for GPU access
#    Ubuntu assigns ssl-cert GID 104 and render GID 108, but
#    the host's /dev/dri/renderD128 uses GID 104 (render on host).
#    Swap the groups so plex gets the right GID.
#    Adapted from tteck/Proxmox Plex script.
# ──────────────────────────────────────────────────────────
- name: Swap ssl-cert and render group GIDs for GPU access
  ansible.builtin.shell: |
    set -e
    if grep -q '^ssl-cert:x:104:' /etc/group 2>/dev/null; then
      sed -i -e 's/^ssl-cert:x:104:plex$/render:x:104:root,plex/' \
             -e 's/^render:x:108:root$/ssl-cert:x:108:plex/' /etc/group
    fi
  changed_when: true
  notify: Restart plexmediaserver

# ──────────────────────────────────────────────────────────
# 10. Grant plex user GPU and media access
# ──────────────────────────────────────────────────────────
- name: Add plex user to GPU and media groups
  ansible.builtin.user:
    name: plex
    groups:
      - video
      - render
      - "{{ plex_server_user }}"
    append: true
  notify: Restart plexmediaserver

# ──────────────────────────────────────────────────────────
# 11. Firewall — open port 32400/tcp (Plex Web UI + streaming)
# ──────────────────────────────────────────────────────────
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow SSH through ufw
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Allow Plex port through ufw
  community.general.ufw:
    rule: allow
    port: '32400'
    proto: tcp

- name: Enable ufw
  community.general.ufw:
    state: enabled

# ──────────────────────────────────────────────────────────
# 12. Enable and start Plex
# ──────────────────────────────────────────────────────────
- name: Enable and start plexmediaserver
  ansible.builtin.systemd:
    name: plexmediaserver
    enabled: true
    state: started

# ──────────────────────────────────────────────────────────
# 13. Cleanup
# ──────────────────────────────────────────────────────────
- name: Clean up apt cache
  ansible.builtin.apt:
    autoclean: true
    autoremove: true
