---
- name: Download BepInExPack_Valheim {{ bepinex_version }}
  ansible.builtin.get_url:
    url: "{{ bepinex_url }}"
    dest: "{{ valheim_dist_dir }}/BepInExPack_Valheim-{{ bepinex_version }}.zip"
    owner: "{{ valheim_user }}"
    mode: "0644"

- name: Create versioned BepInExPack staging directory
  ansible.builtin.file:
    path: "{{ valheim_dist_dir }}/bepinex-{{ bepinex_version }}"
    state: directory
    owner: "{{ valheim_user }}"
    group: "{{ valheim_user }}"
    mode: "0755"

- name: Unpack BepInExPack to staging
  ansible.builtin.unarchive:
    src: "{{ valheim_dist_dir }}/BepInExPack_Valheim-{{ bepinex_version }}.zip"
    dest: "{{ valheim_dist_dir }}/bepinex-{{ bepinex_version }}"
    remote_src: true
    owner: "{{ valheim_user }}"
    group: "{{ valheim_user }}"
    creates: "{{ valheim_dist_dir }}/bepinex-{{ bepinex_version }}/BepInExPack_Valheim"

- name: Install BepInExPack into server dir
  ansible.builtin.copy:
    src: "{{ valheim_dist_dir }}/bepinex-{{ bepinex_version }}/BepInExPack_Valheim/"
    dest: "{{ valheim_server_dir }}/"
    remote_src: true
    owner: "{{ valheim_user }}"
    group: "{{ valheim_user }}"
    mode: preserve
  notify: Restart valheim

- name: Download mods
  ansible.builtin.get_url:
    url: "{{ item.url | default('https://thunderstore.io/package/download/' ~ item.team ~ '/' ~ item.name ~ '/' ~ item.version ~ '/') }}"
    dest: "{{ valheim_dist_dir }}/{{ item.name }}-{{ item.version }}.zip"
    owner: "{{ valheim_user }}"
    mode: "0644"
  loop: "{{ valheim_mods }}"

- name: Create versioned mod directories
  ansible.builtin.file:
    path: "{{ valheim_server_dir }}/BepInEx/plugins/{{ item.name }}-{{ item.version }}"
    state: directory
    owner: "{{ valheim_user }}"
    group: "{{ valheim_user }}"
    mode: "0755"
  loop: "{{ valheim_mods }}"

- name: Check which managed mods are already installed
  ansible.builtin.stat:
    path: "{{ valheim_server_dir }}/BepInEx/plugins/{{ item.name }}-{{ item.version }}/manifest.json"
  loop: "{{ valheim_mods }}"
  loop_control:
    label: "{{ item.name }}-{{ item.version }}"
  register: valheim_mod_installed

# unzip is called directly rather than via ansible.builtin.unarchive because
# some mod zips (Jotunn's, for one) store paths with backslash separators.
# unzip resolves those correctly but exits 1 to flag the warning, and
# unarchive treats any non-zero rc as a failure — which broke the deploy in
# PR #394. rc 1 is "completed with warnings", so only rc > 1 is a real error.
# The stat above replaces unarchive's `creates:` guard: a `creates:` short
# circuit still returns rc 0, so a changed_when based on rc would report
# changed on every run and restart the server each deploy.
# noqa below: unarchive is exactly what cannot be used here (see above). The
# rule stays enabled everywhere else rather than going in .ansible-lint.
- name: Install mods into BepInEx plugins dir # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: >-
      /usr/bin/unzip -o -q
      {{ valheim_dist_dir }}/{{ item.item.name }}-{{ item.item.version }}.zip
      -d {{ valheim_server_dir }}/BepInEx/plugins/{{ item.item.name }}-{{ item.item.version }}
  become: true
  become_user: "{{ valheim_user }}"
  loop: "{{ valheim_mod_installed.results }}"
  loop_control:
    label: "{{ item.item.name }}-{{ item.item.version }}"
  when: not item.stat.exists
  register: valheim_mod_unzip
  # Tolerate exactly 0 (clean) and 1 (completed with warnings). Not
  # `rc > 1`: a signal-killed unzip reports a negative rc, which `> 1`
  # would read as success and then notify a restart on a half-extracted mod.
  failed_when: valheim_mod_unzip.rc is defined and valheim_mod_unzip.rc not in [0, 1]
  # The `when:` above means this only runs for a mod that is not installed
  # yet, so running it is always a change.
  changed_when: true
  notify: Restart valheim

- name: Find outdated managed-mod directories
  ansible.builtin.find:
    paths: "{{ valheim_server_dir }}/BepInEx/plugins"
    file_type: directory
    patterns: "{{ item.name }}-*"
    excludes: "{{ item.name }}-{{ item.version }}"
  loop: "{{ valheim_mods }}"
  register: valheim_stale_mods

- name: Remove outdated managed-mod directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ valheim_stale_mods.results | map(attribute='files') | flatten }}"
  loop_control:
    label: "{{ item.path }}"
  notify: Restart valheim

# Some mods (e.g. ServersideQoL) ship a preloader patcher in a patchers/
# subfolder of their zip. BepInEx only loads patchers from BepInEx/patchers,
# never from inside plugins/, so copy them out after install.
- name: Ensure BepInEx patchers directory exists
  ansible.builtin.file:
    path: "{{ valheim_server_dir }}/BepInEx/patchers"
    state: directory
    owner: "{{ valheim_user }}"
    group: "{{ valheim_user }}"
    mode: "0755"

- name: Find patcher DLLs staged inside installed mod directories
  ansible.builtin.find:
    paths: "{{ valheim_server_dir }}/BepInEx/plugins"
    recurse: true
    patterns: "*.dll"
  register: valheim_mod_dlls

- name: Install staged patcher DLLs into BepInEx/patchers
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ valheim_server_dir }}/BepInEx/patchers/{{ item.path | basename }}"
    remote_src: true
    owner: "{{ valheim_user }}"
    group: "{{ valheim_user }}"
    mode: "0644"
  loop: "{{ valheim_mod_dlls.files | selectattr('path', 'search', '/patchers/') | list }}"
  loop_control:
    label: "{{ item.path }}"
  notify: Restart valheim

- name: Apply managed mod config settings
  community.general.ini_file:
    path: "{{ valheim_server_dir }}/BepInEx/config/{{ item.file }}"
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    owner: "{{ valheim_user }}"
    group: "{{ valheim_user }}"
    mode: "0644"
  loop: "{{ valheim_mod_settings }}"
  loop_control:
    label: "{{ item.file }}:{{ item.option }}"
  notify: Restart valheim

- name: Find retired managed-mod directories
  ansible.builtin.find:
    paths: "{{ valheim_server_dir }}/BepInEx/plugins"
    file_type: directory
    patterns: "{{ item }}-*"
  loop: "{{ valheim_mods_absent }}"
  register: valheim_retired_mods

- name: Remove retired managed-mod directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ valheim_retired_mods.results | map(attribute='files') | flatten }}"
  loop_control:
    label: "{{ item.path }}"
  notify: Restart valheim
