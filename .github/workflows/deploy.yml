name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ════════════════════════════════════════════════════
  # Stage 1: Run Ansible against Proxmox host
  #   - Updates host packages, enables IOMMU/VFIO
  #   - Installs kernel 7, downloads LXC template
  # ════════════════════════════════════════════════════
  deploy-proxmox-prep:
    name: "Stage 1: Proxmox Host Prep"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible + collections
        run: |
          pip install ansible
          ansible-galaxy collection install ansible.posix

      - name: Connect to Proxmox
        uses: ./.github/actions/connect-proxmox
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          ssh-private-key: ${{ secrets.PROXMOX_SSH_KEY }}

      - name: Run Ansible Playbook (Proxmox Prep)
        run: ansible-playbook -i inventory.yml site.yml
        working-directory: ansible/

  # ════════════════════════════════════════════════════
  # Stage 2a: Run Pulumi to provision VMs
  #   - Manages TrueNAS VM config
  #   - Exports Plex IP for Stage 3
  # ════════════════════════════════════════════════════
  deploy-pulumi:
    name: "Stage 2a: Pulumi VM Provision"
    runs-on: ubuntu-latest
    needs: deploy-proxmox-prep
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'

      - name: Connect to Proxmox
        uses: ./.github/actions/connect-proxmox
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          ssh-private-key: ${{ secrets.PROXMOX_SSH_KEY }}

      - name: Pulumi Up
        uses: pulumi/actions@v3
        with:
          command: up
          stack-name: tayvenb13/chalupa-infra/proxmox
          work-dir: pulumi/
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PROXMOX_VE_ENDPOINT: ${{ secrets.PROXMOX_VE_ENDPOINT }}
          PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}
          PROXMOX_VE_SSH_USERNAME: ${{ secrets.PROXMOX_VE_SSH_USERNAME }}

      # Generate inventory for Stage 3 (includes both Proxmox host
      # for LXC creation and the Plex LXC for software configuration)
      - name: Generate Stage 3 inventory
        run: |
          PLEX_IP=$(pulumi stack output plex-ip --stack tayvenb13/chalupa-infra/proxmox)
          cat > inventory-vms.yml <<EOF
          all:
            children:
              proxmox:
                hosts:
                  pve1:
                    ansible_host: 192.168.1.223
                    ansible_user: root
              plex_servers:
                hosts:
                  plex:
                    ansible_host: ${PLEX_IP}
                    ansible_user: root
                    ansible_ssh_common_args: '-o StrictHostKeyChecking=accept-new'
          EOF
        working-directory: pulumi/
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Upload VM inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: inventory-vms
          path: pulumi/inventory-vms.yml

  # ════════════════════════════════════════════════════
  # Stage 2b: Run Pulumi to provision Talos K8s cluster
  #   - Creates 3 Talos VMs (1 CP + 2 workers)
  #   - Generates machine configs, bootstraps cluster
  #   - Exports kubeconfig + talosconfig
  # ════════════════════════════════════════════════════
  deploy-talos:
    name: "Stage 2b: Talos K8s Cluster"
    runs-on: ubuntu-latest
    needs: deploy-proxmox-prep
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'

      - name: Connect to Proxmox
        uses: ./.github/actions/connect-proxmox
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          ssh-private-key: ${{ secrets.PROXMOX_SSH_KEY }}

      - name: Pulumi Up (Talos Cluster)
        uses: pulumi/actions@v3
        with:
          command: up
          stack-name: tayvenb13/chalupa-talos/proxmox
          work-dir: pulumi-talos/
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PROXMOX_VE_ENDPOINT: ${{ secrets.PROXMOX_VE_ENDPOINT }}
          PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}
          PROXMOX_VE_SSH_USERNAME: ${{ secrets.PROXMOX_VE_SSH_USERNAME }}
        timeout-minutes: 30

  # ════════════════════════════════════════════════════
  # Stage 3: Create Plex LXC + configure software
  #   - Creates LXC container on Proxmox host (privileged, GPU, nesting)
  #   - Installs Plex, VA-API drivers, NFS mounts, firewall inside LXC
  # ════════════════════════════════════════════════════
  deploy-vm-configure:
    name: "Stage 3: LXC Create + Configure"
    runs-on: ubuntu-latest
    needs: deploy-pulumi
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible + collections
        run: |
          pip install ansible
          ansible-galaxy collection install ansible.posix community.general

      - name: Download VM inventory artifact
        uses: actions/download-artifact@v4
        with:
          name: inventory-vms
          path: ansible/

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-runner

      # Same SSH key — authenticates as 'root' on the Plex LXC
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROXMOX_SSH_KEY }}

      - name: Add hosts to known_hosts
        run: |
          echo "192.168.1.223 pve1" | sudo tee -a /etc/hosts
          echo "192.168.1.224 plex" | sudo tee -a /etc/hosts
          ssh-keyscan -H 192.168.1.223 >> ~/.ssh/known_hosts
          # Plex LXC keyscan is skipped — the container may not exist yet
          # (it's created by the first Ansible play). The plex_servers
          # inventory uses StrictHostKeyChecking=accept-new instead.

      - name: Run Ansible Playbook (LXC Configure)
        run: ansible-playbook -i inventory-vms.yml playbooks/vm-configure.yml
        working-directory: ansible/

  # ════════════════════════════════════════════════════
  # Stage 4: Bootstrap ArgoCD on Talos cluster
  #   - Retrieves kubeconfig from Pulumi state
  #   - Installs ArgoCD via Helm
  # ════════════════════════════════════════════════════
  deploy-argocd:
    name: "Stage 4: ArgoCD Bootstrap"
    runs-on: ubuntu-latest
    needs: deploy-talos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-runner

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install Pulumi CLI
        run: curl -fsSL https://get.pulumi.com | sh && echo "$HOME/.pulumi/bin" >> $GITHUB_PATH

      - name: Get kubeconfig from Pulumi
        run: |
          pulumi stack output kubeconfig --show-secrets --stack tayvenb13/chalupa-talos/proxmox --cwd pulumi-talos/ > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Wait for Kubernetes API
        run: |
          export KUBECONFIG=/tmp/kubeconfig
          for i in $(seq 1 30); do
            if kubectl get nodes &>/dev/null; then
              echo "Kubernetes API is ready"
              kubectl get nodes
              exit 0
            fi
            echo "Waiting for Kubernetes API... (attempt $i/30)"
            sleep 10
          done
          echo "Kubernetes API did not become ready"
          exit 1
        timeout-minutes: 6

      - name: Install ArgoCD (bootstrap)
        run: |
          export KUBECONFIG=/tmp/kubeconfig
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd --create-namespace \
            --version 9.5.11 \
            --values .github/argocd-bootstrap-values.yaml \
            --wait --timeout 5m

      - name: Apply root Application
        run: |
          export KUBECONFIG=/tmp/kubeconfig
          kubectl apply -n argocd -f gitops/bootstrap/root-app.yaml
          # Wait for the root app to be created; ApplicationSets will fan
          # out asynchronously and reconcile in the background. We don't
          # block the pipeline on Synced/Healthy here because first sync
          # of MetalLB CRDs may need a retry pass.
          kubectl wait --for=condition=Established crd/applications.argoproj.io --timeout=60s || true
          kubectl get -n argocd application root || true
