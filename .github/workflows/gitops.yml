name: GitOps Lint & Render

on:
  pull_request:
    branches:
      - main
    paths:
      - 'gitops/**'
      - '.github/workflows/gitops.yml'
  workflow_dispatch:

jobs:
  lint-and-render:
    name: Lint and dry-render gitops/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yamllint
        run: pip install yamllint==1.35.1

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/

      - name: yamllint gitops/
        run: yamllint gitops/

      - name: Helm dependency update + template + kubeconform
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail=0

          # Charts may include `fail` directives that abort rendering when a
          # CRD's apiVersion isn't available in the cluster's discovered
          # capabilities (e.g., Traefik's servicemonitor.yaml fails when
          # monitoring.coreos.com/v1 isn't deployed). In CI there is no
          # cluster, so we lie to helm via --api-versions. The CRDs listed
          # here are all installed on our actual cluster (PR #156 +
          # cnpg-operator + ESO + Traefik), so claiming they exist matches
          # production reality.
          API_VERSIONS=(
            --api-versions monitoring.coreos.com/v1
            --api-versions monitoring.coreos.com/v1/ServiceMonitor
            --api-versions monitoring.coreos.com/v1/PodMonitor
            --api-versions monitoring.coreos.com/v1/PrometheusRule
            --api-versions external-secrets.io/v1
            --api-versions traefik.io/v1alpha1
          )

          # The datreeio CRDs-catalog has stale schemas for vm-operator's
          # VictoriaMetrics CRDs (e.g., VMNodeScrape.spec.scrapeInterval and
          # VMAgent.spec.statefulStorage.{accessModes,resources,storageClassName}
          # are valid in the actual operator's CRDs but missing from the
          # catalog's v1beta1 snapshot). vm-operator validates these at runtime;
          # skip them in catalog-based static validation to avoid false negatives.
          SKIP_KINDS='VMSingle,VMAgent,VMServiceScrape,VMPodScrape,VMNodeScrape,VMRule,VMUser,VMAlertmanager,VMAlert,VMCluster,VMAuth'

          for chart_dir in gitops/apps/*/*/; do
            if [ -f "${chart_dir}Chart.yaml" ]; then
              echo "==> Rendering ${chart_dir}"
              helm dependency update "${chart_dir}"
              helm template "$(basename "${chart_dir}")" "${chart_dir}" \
                "${API_VERSIONS[@]}" \
                | kubeconform -strict -ignore-missing-schemas -summary \
                  -skip "${SKIP_KINDS}" \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                  || fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi

      - name: yamllint applicationsets/
        run: |
          if compgen -G "gitops/bootstrap/applicationsets/*.yaml" > /dev/null; then
            yamllint gitops/bootstrap/applicationsets/
          else
            echo "No ApplicationSets yet — skipping"
          fi

      - name: kubeconform bootstrap manifests
        run: |
          kubeconform -strict -ignore-missing-schemas -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            gitops/bootstrap/root-app.yaml \
            gitops/bootstrap/applicationsets/
