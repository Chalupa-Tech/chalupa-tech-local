name: Pulumi

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint Pulumi (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'

      - name: Lint pulumi/
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: pulumi/
          install-mode: goinstall

      - name: Lint pulumi-talos/
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: pulumi-talos/
          install-mode: goinstall

  preview:
    name: Pulumi Preview (Infra)
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      pull-requests: write
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'

      - name: Connect to Proxmox
        uses: ./.github/actions/connect-proxmox
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          ssh-private-key: ${{ secrets.PROXMOX_SSH_KEY }}

      - name: Pulumi Preview
        uses: pulumi/actions@v3
        with:
          command: preview
          stack-name: tayvenb13/chalupa-infra/proxmox
          work-dir: pulumi/
          comment-on-pr: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PROXMOX_VE_ENDPOINT: ${{ secrets.PROXMOX_VE_ENDPOINT }}
          PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}
          PROXMOX_VE_SSH_USERNAME: ${{ secrets.PROXMOX_VE_SSH_USERNAME }}

  preview-talos:
    name: Pulumi Preview (Talos)
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      pull-requests: write
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'

      - name: Connect to Proxmox
        uses: ./.github/actions/connect-proxmox
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          ssh-private-key: ${{ secrets.PROXMOX_SSH_KEY }}

      - name: Pulumi Preview (Talos)
        uses: pulumi/actions@v3
        with:
          command: preview
          stack-name: tayvenb13/chalupa-talos/proxmox
          work-dir: pulumi-talos/
          comment-on-pr: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PROXMOX_VE_ENDPOINT: ${{ secrets.PROXMOX_VE_ENDPOINT }}
          PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}
          PROXMOX_VE_SSH_USERNAME: ${{ secrets.PROXMOX_VE_SSH_USERNAME }}
