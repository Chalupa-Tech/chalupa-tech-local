name: Pulumi

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint Pulumi (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: pulumi/
          install-mode: goinstall

  preview:
    name: Pulumi Preview
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      pull-requests: write
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-runner

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROXMOX_SSH_KEY }}
          
      - name: Ensure Proxmox host resolution
        run: |
          echo "192.168.1.223 proxmox" | sudo tee -a /etc/hosts
          echo "192.168.1.223 pve1" | sudo tee -a /etc/hosts

      - name: Add Proxmox to known_hosts
        run: |
          ssh-keyscan -H 192.168.1.223 >> ~/.ssh/known_hosts
          ssh-keyscan -H proxmox >> ~/.ssh/known_hosts
          ssh-keyscan -H pve1 >> ~/.ssh/known_hosts

      - name: Clean up old Pulumi state
        run: |
          curl -fsSL https://get.pulumi.com | sh
          export PATH=$PATH:$HOME/.pulumi/bin
          pulumi login
          pulumi stack select tayvenb13/chalupa-infra/proxmox
          for urn in $(pulumi stack --show-urns | grep -iE 'plex|talos' | awk '{print $3}'); do
            echo "Deleting $urn from state..."
            pulumi state delete "$urn" --force -y || true
          done
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Pulumi Preview
        uses: pulumi/actions@v3
        with:
          command: preview
          stack-name: tayvenb13/chalupa-infra/proxmox
          work-dir: pulumi/
          comment-on-pr: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PROXMOX_VE_ENDPOINT: ${{ secrets.PROXMOX_VE_ENDPOINT }}
          PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}
          PROXMOX_VE_SSH_USERNAME: ${{ secrets.PROXMOX_VE_SSH_USERNAME }}


