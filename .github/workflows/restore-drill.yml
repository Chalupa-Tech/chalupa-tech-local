name: Restore Drill

# Monthly proof that the Proxmox backups are restorable: restores the newest
# HAOS (250) and Plex LXC (200) archives to scratch VMIDs 9250/9200 on pve1,
# checks them, destroys them, and integrity-tests the TrueNAS (101) and
# Tailscale LXC (100) archives. See scripts/proxmox/restore-drill.sh and
# docs/2026-11-04-fix-proxmox-backups.md. A failure opens/updates a GitHub
# issue labelled backup-drill-failed; vmalert's ProxmoxRestoreDrillStale
# fires if no success is recorded for 40 days.

on:
  schedule:
    # 12:00 UTC on the 1st = 05:00 MST / 06:00 MDT (cron has no DST). Two
    # hours after the maintenance window's Sunday slot so a 1st-of-the-month
    # Sunday can never reboot pve1 mid-restore; both share a concurrency group.
    - cron: '0 12 1 * *'
  workflow_dispatch:

concurrency:
  group: pve1-host-ops
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drill:
    name: Restore newest backups to scratch VMIDs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Connect to Proxmox
        uses: ./.github/actions/connect-proxmox
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          ssh-private-key: ${{ secrets.PROXMOX_SSH_KEY }}

      - name: Install drill script on pve1
        run: scp -o StrictHostKeyChecking=yes scripts/proxmox/restore-drill.sh root@192.168.1.223:/usr/local/bin/restore-drill.sh

      - name: Run restore drill
        run: ssh -o StrictHostKeyChecking=yes root@192.168.1.223 'chmod 0755 /usr/local/bin/restore-drill.sh && /usr/local/bin/restore-drill.sh'

  report:
    name: Open issue on failure
    runs-on: ubuntu-latest
    needs: drill
    if: failure()
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const label = 'backup-drill-failed';
            const title = 'Restore drill failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The monthly Proxmox restore drill failed: ${runUrl}\n\nBackups are unverified until this passes. Run \`gh workflow run restore-drill.yml\` after fixing.`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: label,
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: [label],
              });
            }
