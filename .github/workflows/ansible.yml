name: Ansible

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ansible-lint
        run: pip install ansible-lint

      - name: Run ansible-lint
        run: ansible-lint
        working-directory: ansible/

  check-and-diff:
    name: Check & Diff (PR)
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: pip install ansible

      # Assuming connection requires SSH keys stored in secrets
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROXMOX_SSH_KEY }}
          
      - name: Add Proxmox to known_hosts
        run: ssh-keyscan -H 192.168.1.223 >> ~/.ssh/known_hosts
        
      # Using a GitHub Action to create a VPN connection might be needed if the Proxmox host isn't public,
      # but standard Tailscale setup or a self-hosted runner is typical here. Assuming runner has access for now.

      - name: Run Ansible Check & Diff
        id: ansible_check
        run: |
          output=$(ansible-playbook -i inventory.yml site.yml --check --diff 2>&1)
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$output" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        working-directory: ansible/
        continue-on-error: true

      - name: Comment PR with output
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### Ansible Check & Diff
            <details><summary>Show Output</summary>

            ```
            ${{ steps.ansible_check.outputs.output }}
            ```

            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  deploy:
    name: Run Ansible Playbook
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: pip install ansible

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROXMOX_SSH_KEY }}
          
      - name: Add Proxmox to known_hosts
        run: ssh-keyscan -H 192.168.1.223 >> ~/.ssh/known_hosts

      - name: Run Ansible Playbook
        run: ansible-playbook -i inventory.yml site.yml
        working-directory: ansible/
