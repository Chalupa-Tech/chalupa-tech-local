name: Ansible

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ansible-lint
        run: |
          pip install ansible-lint
          ansible-galaxy collection install ansible.posix community.general

      - name: Run ansible-lint
        run: ansible-lint
        working-directory: ansible/

  check-and-diff:
    name: Check & Diff (PR)
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      pull-requests: write
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: pip install ansible

      - name: Connect to Proxmox
        uses: ./.github/actions/connect-proxmox
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          ssh-private-key: ${{ secrets.PROXMOX_SSH_KEY }}

      - name: Run Ansible Check & Diff
        id: ansible_check
        run: |
          output=$(ansible-playbook -i inventory.yml site.yml --check --diff 2>&1)
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$output" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        working-directory: ansible/
        continue-on-error: true

      - name: Comment PR with output
        uses: actions/github-script@v7
        env:
          ANSIBLE_OUTPUT: ${{ steps.ansible_check.outputs.output }}
        with:
          script: |
            const output = `### Ansible Check & Diff
            <details><summary>Show Output</summary>

            \`\`\`
            ${process.env.ANSIBLE_OUTPUT}
            \`\`\`

            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })


