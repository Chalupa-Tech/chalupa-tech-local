name: Ansible

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ansible-lint
        run: |
          pip install ansible-lint
          ansible-galaxy collection install ansible.posix community.general

      - name: Run ansible-lint
        run: ansible-lint
        working-directory: ansible/

  check-and-diff:
    name: Check & Diff (PR)
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      pull-requests: write
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: pip install ansible

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-runner

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROXMOX_SSH_KEY }}
          
      - name: Ensure Proxmox host resolution
        run: |
          echo "192.168.1.223 proxmox" | sudo tee -a /etc/hosts
          echo "192.168.1.223 pve1" | sudo tee -a /etc/hosts

      - name: Add Proxmox to known_hosts
        run: |
          # ansible_host in inventory.yml is the IP address, so only the
          # IP entry is required. Proxmox sshd intermittently drops
          # back-to-back unauthenticated keyscan connections from the
          # same source IP, so retry on transient failure.
          for attempt in 1 2 3; do
            if ssh-keyscan -H 192.168.1.223 >> ~/.ssh/known_hosts; then
              exit 0
            fi
            echo "ssh-keyscan attempt $attempt failed, retrying in 5s..." >&2
            sleep 5
          done
          echo "ERROR: ssh-keyscan failed after 3 attempts" >&2
          exit 1
        
      - name: Run Ansible Check & Diff
        id: ansible_check
        run: |
          output=$(ansible-playbook -i inventory.yml site.yml --check --diff 2>&1)
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$output" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        working-directory: ansible/
        continue-on-error: true

      - name: Comment PR with output
        uses: actions/github-script@v7
        env:
          ANSIBLE_OUTPUT: ${{ steps.ansible_check.outputs.output }}
        with:
          script: |
            const output = `### Ansible Check & Diff
            <details><summary>Show Output</summary>

            \`\`\`
            ${process.env.ANSIBLE_OUTPUT}
            \`\`\`

            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })


