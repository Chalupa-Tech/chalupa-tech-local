name: Connect to Proxmox
description: Establish Tailscale VPN, SSH agent, host resolution, and known_hosts for the Proxmox server

inputs:
  ts-oauth-client-id:
    description: Tailscale OAuth client ID
    required: true
  ts-oauth-secret:
    description: Tailscale OAuth secret
    required: true
  ssh-private-key:
    description: SSH private key for Proxmox
    required: true

runs:
  using: composite
  steps:
    - name: Connect to Tailscale
      uses: tailscale/github-action@v3
      with:
        oauth-client-id: ${{ inputs.ts-oauth-client-id }}
        oauth-secret: ${{ inputs.ts-oauth-secret }}
        tags: tag:github-runner

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}

    - name: Ensure Proxmox host resolution
      shell: bash
      run: |
        echo "192.168.1.223 proxmox" | sudo tee -a /etc/hosts
        echo "192.168.1.223 pve1" | sudo tee -a /etc/hosts

    - name: Add Proxmox to known_hosts
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if ssh-keyscan -H 192.168.1.223 >> ~/.ssh/known_hosts; then
            exit 0
          fi
          echo "ssh-keyscan attempt $attempt failed, retrying in 5s..." >&2
          sleep 5
        done
        echo "ERROR: ssh-keyscan failed after 3 attempts" >&2
        exit 1
