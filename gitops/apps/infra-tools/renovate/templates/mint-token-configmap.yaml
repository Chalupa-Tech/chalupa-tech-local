apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-mint-token
  namespace: renovate
data:
  # Mints a short-lived GitHub App installation token using only Node's
  # built-in crypto + fetch (no extra deps), then writes it world-readable to
  # the shared /auth volume for Renovate's config.js to consume.
  mint-token.js: |
    const fs = require('fs');
    const crypto = require('crypto');

    (async () => {
      const appId = fs.readFileSync('/github-app/appId', 'utf8').trim();
      const installationId = fs.readFileSync('/github-app/installationId', 'utf8').trim();
      const privateKey = fs.readFileSync('/github-app/privateKey', 'utf8');

      const now = Math.floor(Date.now() / 1000);
      const enc = (obj) => Buffer.from(JSON.stringify(obj)).toString('base64url');
      const unsigned =
        `${enc({ alg: 'RS256', typ: 'JWT' })}.` +
        `${enc({ iat: now - 60, exp: now + 540, iss: appId })}`;
      const signature = crypto
        .sign('RSA-SHA256', Buffer.from(unsigned), privateKey)
        .toString('base64url');
      const jwt = `${unsigned}.${signature}`;

      const res = await fetch(
        `https://api.github.com/app/installations/${installationId}/access_tokens`,
        {
          method: 'POST',
          headers: {
            Authorization: `Bearer ${jwt}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'chalupa-renovate-token-minter',
          },
        },
      );

      if (!res.ok) {
        console.error(`Failed to mint installation token: ${res.status} ${await res.text()}`);
        process.exit(1);
      }

      const body = await res.json();
      fs.writeFileSync('/auth/token', body.token);
      fs.chmodSync('/auth/token', 0o444);
      console.log(`Minted installation token, expires at ${body.expires_at}`);
    })().catch((err) => {
      console.error(err);
      process.exit(1);
    });
