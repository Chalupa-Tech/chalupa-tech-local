apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github-app
  namespace: renovate
  annotations:
    # Materialize before the CronJob's init container needs it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: renovate-github-app
    creationPolicy: Owner
  data:
    - secretKey: appId
      remoteRef:
        key: secret/data/renovate/github-app
        property: appId
    - secretKey: installationId
      remoteRef:
        key: secret/data/renovate/github-app
        property: installationId
    - secretKey: privateKey
      remoteRef:
        key: secret/data/renovate/github-app
        property: privateKey
