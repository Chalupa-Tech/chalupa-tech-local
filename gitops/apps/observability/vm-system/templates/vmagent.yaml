apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  name: vmagent-chalupa
  namespace: vm-system
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  replicaCount: 1
  scrapeInterval: 30s
  remoteWrite:
    - url: http://vmsingle-vmsingle-chalupa.vm-system.svc.cluster.local:8429/api/v1/write

  # Discover all scrape CRDs cluster-wide (both VM-native and prometheus-operator-CRD form).
  selectAllByDefault: true
  serviceScrapeNamespaceSelector: {}
  serviceScrapeSelector: {}
  podScrapeNamespaceSelector: {}
  podScrapeSelector: {}
  nodeScrapeNamespaceSelector: {}
  nodeScrapeSelector: {}
  staticScrapeNamespaceSelector: {}
  staticScrapeSelector: {}
  probeNamespaceSelector: {}
  probeSelector: {}

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 100m
      memory: 256Mi

  extraArgs:
    remoteWrite.tmpDataPath: /tmp/vmagent
    promscrape.streamParse: "true"

  # NOTE: statefulMode + statefulStorage were originally specified per the
  # plan to give vmagent a 5 Gi local-path WAL surviving vmsingle outages,
  # but vm-operator 0.69.0 (chart 0.62.1) silently drops the resources
  # field from statefulStorage during translation to StatefulSet's
  # volumeClaimTemplates, producing:
  #   StatefulSet.apps "vmagent-vmagent-chalupa" is invalid:
  #     spec.volumeClaimTemplates[0].spec.resources[storage]: Required value
  # vmagent therefore never spawned a pod and vmsingle ingested zero data
  # from PR #158 merge until this fix landed. Reverting to Deployment mode
  # (no statefulMode) gets vmagent scraping immediately. The WAL buffer was
  # always a nice-to-have at homelab scale (single-cluster, vmsingle restarts
  # in seconds); re-enable later by finding the correct vm-operator 0.6x
  # storage syntax.

  livenessProbe:
    httpGet:
      path: /health
      port: 8429
    timeoutSeconds: 5
  readinessProbe:
    httpGet:
      path: /health
      port: 8429
    timeoutSeconds: 5
