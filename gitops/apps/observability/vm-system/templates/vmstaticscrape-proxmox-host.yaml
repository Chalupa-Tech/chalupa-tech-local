apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: proxmox-host
  namespace: vm-system
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  # jobName becomes the `job` label — the proxmox-host.yaml VMRules and
  # the TargetDown safety net both match on it.
  jobName: proxmox-host
  targetEndpoints:
    - targets:
        - 192.168.1.223:9100
      # No per-endpoint interval: vmagent's global 30s default applies.
      # (The endpoint-level field is `interval`, not `scrapeInterval` —
      # the operator's admission webhook rejected the latter and blocked
      # the whole vm-system sync; observed live 2026-09-09.)
      relabelConfigs:
        # `instance` would default to the raw address; pve1 reads better
        # in alerts and dashboards.
        - targetLabel: instance
          replacement: pve1
