grafana:
  replicas: 1

  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  persistence:
    enabled: true
    size: 5Gi
    storageClassName: local-path
    accessModes: [ReadWriteOnce]

  # Disable the init-chown-data container. The chart runs `chown -R 472:472
  # /var/lib/grafana` in an init container with capabilities.drop=[ALL] +
  # add=[CHOWN]. That keeps CAP_CHOWN but drops CAP_DAC_READ_SEARCH, so when
  # Grafana later creates mode-700 subdirs at runtime (png/csv/pdf, etc.),
  # the next pod restart's init-chown can't traverse into them and fails
  # with "Permission denied". Pods crash-loop until someone chmods the dirs
  # by hand. fsGroup: 472 on the pod (default in the chart) already makes
  # kubelet apply group ownership at mount time, which is all we need.
  # Observed live 2026-05-11 after a routine grafana pod restart.
  initChownData:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    timeoutSeconds: 5
    periodSeconds: 30
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    timeoutSeconds: 5
    periodSeconds: 10

  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer
    auth:
      disable_login_form: false
    server:
      root_url: https://grafana.frame.chalupatech.com/
      domain: grafana.frame.chalupatech.com
    analytics:
      reporting_enabled: false
      check_for_updates: false

  sidecar:
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      # Watch ConfigMaps across all namespaces so apps can ship their own
      # datasources alongside themselves. Default ("") restricts to the
      # release namespace.
      searchNamespace: ALL
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      folder: /tmp/dashboards
      provider:
        foldersFromFilesStructure: false
      # Watch ConfigMaps across all namespaces so apps can ship their own
      # dashboards alongside themselves. Default ("") restricts to the
      # release namespace.
      searchNamespace: ALL

  serviceMonitor:
    enabled: true
    interval: 30s

  plugins:
    - victoriametrics-logs-datasource

  testFramework:
    enabled: false
