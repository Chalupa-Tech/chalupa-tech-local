apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: truenas-alerts-api-key
  namespace: truenas-alerts
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: truenas-alerts-api-key
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: secret/truenas-alerts/api-key
        property: key
