# Static basic-auth credentials for scraping scraparr's /metrics endpoint.
# These are NOT a security boundary — the /metrics service is ClusterIP only
# (no Traefik route), so the only callers are in-cluster (vmagent). The
# scraparr chart requires SOME auth to be configured; matching what's in
# values.yaml's `config.auth` keeps it consistent. Real secrets (the *arr
# API keys) live in OpenBao via the scraparr-apikeys ExternalSecret.
apiVersion: v1
kind: Secret
metadata:
  name: scraparr-scrape-auth
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  username: scraparr
  password: scraparr-internal
