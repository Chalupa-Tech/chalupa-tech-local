apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scraparr-apikeys
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: scraparr-apikeys
    creationPolicy: Owner
  # One-key-per-path matches the kv-put.sh convention documented in
  # scripts/openbao/README.md (Phase 4). Each *arr's API key lives at
  # its own path with a single `apikey` property, so `kv-put.sh` can
  # write each in one call without clobbering siblings.
  data:
    - secretKey: sonarr
      remoteRef:
        key: scraparr/sonarr-api-key
        property: apikey
    - secretKey: radarr
      remoteRef:
        key: scraparr/radarr-api-key
        property: apikey
    - secretKey: seerr
      remoteRef:
        key: scraparr/seerr-api-key
        property: apikey
