scraparr:
  replicaCount: 1

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

  # API keys are pulled from the ExternalSecret `scraparr-apikeys`
  # (templates/scraparr-apikeys-externalsecret.yaml) which syncs from
  # OpenBao at secret/scraparr/api-keys. The chart's `api_key: { type: ref, ... }`
  # pattern injects each value as an env var and writes ${VARNAME} into
  # the config.yaml — keeps the actual secret out of the rendered chart.
  #
  # Whisparr isn't configured here yet — no API key in OpenBao. Add a
  # `whisparr` key to the OpenBao secret and uncomment the stanza below
  # to enable.
  #
  # The seerr-team/seerr fork shares the Overseerr API surface, so we
  # use the generic `seerr` connector (scraparr/connectors/seerr.py).
  config:
    auth:
      username: scraparr
      # Static password — scraparr's /metrics endpoint is in-cluster only,
      # not exposed via Traefik. VMServiceScrape uses these credentials
      # via basicAuth to scrape. Real secret value is the same string in
      # the K8s secret so this rendered ConfigMap is fine.
      password: scraparr-internal

    sonarr:
      - url: http://sonarr.media.svc.cluster.local:8989
        alias: sonarr
        api_version: v3
        interval: 30
        detailed: true
        api_key:
          type: ref
          name: SCRAPARR_SONARR_API_KEY
          valueFrom:
            secretKeyRef:
              name: scraparr-apikeys
              key: sonarr

    radarr:
      - url: http://radarr.media.svc.cluster.local:7878
        alias: radarr
        api_version: v3
        interval: 30
        detailed: true
        api_key:
          type: ref
          name: SCRAPARR_RADARR_API_KEY
          valueFrom:
            secretKeyRef:
              name: scraparr-apikeys
              key: radarr

    # The seerr-team/seerr fork (ghcr.io/seerr-team/seerr) is Overseerr-
    # API-compatible (verified: `GET /api/v1/status` returns the same
    # version/commitTag/updateAvailable JSON shape as Overseerr). The
    # scraparr binary's ACTIVE_CONNECTORS list (src/scraparr/const.py)
    # only recognizes `overseerr` and `jellyseerr` — a `seerr:` key is
    # silently ignored. Using the `overseerr` key with seerr's URL
    # routes the scrape through scraparr's Overseerr connector which
    # works against the unified seerr fork.
    overseerr:
      - url: http://seerr.media.svc.cluster.local:5055
        alias: seerr
        api_version: v1
        interval: 30
        detailed: true
        api_key:
          type: ref
          name: SCRAPARR_SEERR_API_KEY
          valueFrom:
            secretKeyRef:
              name: scraparr-apikeys
              key: seerr

    # Override the chart's defaults (which set each unconfigured
    # service to `{}`). Two problems with leaving them as empty maps:
    #
    # 1. The chart's deployment template emits a `wait-for-<service>`
    #    init container for any key matching the regex
    #    `radarr|sonarr|prowlarr|bazarr|readarr|lidarr|jellyseerr|overseerr`
    #    — with empty map, it generates an init pointed at an empty
    #    URL that loops 30×10s and fails.
    #
    # 2. The scraparr BINARY parses `<service>: {}` as one instance
    #    with no URL/api_key and crashes on validation
    #    ("Invalid config: whisparr (instance 0): missing 'url'").
    #    The binary supports services not in the chart's init regex —
    #    whisparr, jellyfin, kavita — so those also need overrides.
    #
    # Empty lists `[]` solve both: the chart's "kindIs slice" branch
    # iterates zero items (no init container), and the binary sees
    # zero instances (no validation error).
    #
    # `overseerr` is configured above — not in this list. `seerr` is
    # not a scraparr connector at all (despite us using the seerr-team
    # fork) so no override needed for it.
    bazarr: []
    jellyfin: []
    jellyseerr: []
    kavita: []
    lidarr: []
    prowlarr: []
    readarr: []
    whisparr: []

    # whisparr:
    #   - url: http://whisparr.media.svc.cluster.local:6969
    #     alias: whisparr
    #     api_version: v3
    #     interval: 30
    #     detailed: true
    #     api_key:
    #       type: ref
    #       name: SCRAPARR_WHISPARR_API_KEY
    #       valueFrom:
    #         secretKeyRef:
    #           name: scraparr-apikeys
    #           key: whisparr

  service:
    main:
      ports:
        http:
          port: 7100
