apiVersion: v2
name: scraparr
description: |
  Prometheus exporter for the *arr suite. One deployment scrapes
  Sonarr, Radarr, and Seerr (and Whisparr/Lidarr/Prowlarr/Bazarr
  when configured) via their HTTP APIs and exposes the result on
  /metrics for VictoriaMetrics to ingest.

  API keys for each *arr live in OpenBao at secret/scraparr/api-keys,
  sync'd into K8s as the `scraparr-apikeys` secret by ExternalSecret,
  and injected into the scraparr pod as env vars referenced from the
  rendered config.yaml.
type: application
version: 0.1.0
appVersion: "3.0.3"
dependencies:
  - name: scraparr
    version: 1.4.0
    repository: https://imgios.github.io/scraparr
