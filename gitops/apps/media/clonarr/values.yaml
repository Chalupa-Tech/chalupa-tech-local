app-template:
  defaultPodOptions:
    securityContext:
      runAsNonRoot: false
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch

  controllers:
    clonarr:
      type: deployment
      replicas: 1
      strategy: Recreate
      initContainers:
        # Clonarr's own `git clone --sparse` + `git sparse-checkout set --no-cone`
        # sequence races on NFS — the second command's pattern update is
        # silently dropped, leaving the working tree at the cone-mode default
        # (`/*` + `!/*/`). Result: `docs/json/` (where TRaSH ships its
        # profile + custom-format JSON) is never materialized and Clonarr's
        # UI reports "Pull completed but no TRaSH data was loaded".
        #
        # This init container pre-seeds the clone with the correct
        # non-cone pattern so Clonarr finds an already-valid working tree
        # on first start. Idempotent — re-applies the pattern on every pod
        # boot, no-op when correct.
        ensure-sparse-checkout:
          image:
            repository: ghcr.io/prophetse7en/clonarr
            tag: v2.5.6
          env:
            # Same git safe.directory bypass as the main container —
            # see comment there.
            GIT_CONFIG_COUNT: "1"
            GIT_CONFIG_KEY_0: safe.directory
            GIT_CONFIG_VALUE_0: "*"
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              REPO=/config/data/trash-guides
              if [ ! -d "$REPO/.git" ]; then
                echo "No existing TRaSH-Guides clone — performing initial sparse clone."
                mkdir -p "$(dirname "$REPO")"
                git clone --filter=blob:none --sparse \
                  https://github.com/TRaSH-Guides/Guides.git "$REPO"
              fi
              cd "$REPO"
              git sparse-checkout set --no-cone \
                docs/json/ docs/updates.txt includes/cf-descriptions/
              echo "Materialized docs/json contents:"
              ls -d docs/json/*/ 2>/dev/null || echo "(empty — fresh clone)"
      containers:
        main:
          image:
            repository: ghcr.io/prophetse7en/clonarr
            tag: v2.5.6
          env:
            TZ: America/Los_Angeles
            PUID: "1000"
            PGID: "1000"
            PORT: "6060"
            # Tell git to trust the TRaSH-Guides clone path. With NFS +
            # PUID/PGID drop, the in-pod stat() of /config/data/trash-guides
            # reports an owner that doesn't match the running clonarr
            # process, so git's CVE-2022-24765 dubious-ownership guard
            # would otherwise refuse to pull.
            GIT_CONFIG_COUNT: "1"
            GIT_CONFIG_KEY_0: safe.directory
            GIT_CONFIG_VALUE_0: "*"
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 6060
                initialDelaySeconds: 30
                periodSeconds: 30
                timeoutSeconds: 10
                failureThreshold: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 6060
                initialDelaySeconds: 5
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 5
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 6060
                initialDelaySeconds: 10
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 30
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi

  service:
    clonarr:
      controller: clonarr
      ports:
        http:
          port: 6060

  persistence:
    config:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: media-plexmedia
      globalMounts:
        - path: /config
          subPath: Configs/clonarr
