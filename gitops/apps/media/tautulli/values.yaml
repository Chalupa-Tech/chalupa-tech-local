app-template:
  defaultPodOptions:
    securityContext:
      runAsNonRoot: false
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch

  controllers:
    tautulli:
      type: deployment
      replicas: 1
      strategy: Recreate
      containers:
        main:
          image:
            repository: lscr.io/linuxserver/tautulli
            # v2.17.1-ls230 — current LSIO release.
            # LSIO advised that <=2.16.1 has CVEs, so pin to 2.17.x and
            # avoid :latest here even though sibling wrappers use :latest.
            tag: v2.17.1-ls230
          env:
            TZ: America/Los_Angeles
            PUID: "1000"
            PGID: "1000"
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /status
                  port: 8181
                initialDelaySeconds: 30
                periodSeconds: 30
                timeoutSeconds: 10
                failureThreshold: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /status
                  port: 8181
                initialDelaySeconds: 5
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 5
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /status
                  port: 8181
                initialDelaySeconds: 15
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 60
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 512Mi

  service:
    tautulli:
      controller: tautulli
      ports:
        http:
          port: 8181

  persistence:
    config:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: media-plexmedia
      globalMounts:
        - path: /config
          subPath: Configs/tautulli
