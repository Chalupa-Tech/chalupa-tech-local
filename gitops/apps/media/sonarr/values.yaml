app-template:
  defaultPodOptions:
    securityContext:
      runAsNonRoot: false
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch

  controllers:
    sonarr:
      type: deployment
      replicas: 1
      strategy: Recreate
      containers:
        main:
          image:
            repository: lscr.io/linuxserver/sonarr
            tag: latest
          env:
            TZ: America/Los_Angeles
            PUID: "1000"
            PGID: "1000"
            Sonarr__Postgres__Host: arrs-pg-rw.media.svc.cluster.local
            Sonarr__Postgres__Port: "5432"
            Sonarr__Postgres__User:
              valueFrom:
                secretKeyRef:
                  name: sonarr-pg
                  key: username
            Sonarr__Postgres__Password:
              valueFrom:
                secretKeyRef:
                  name: sonarr-pg
                  key: password
            Sonarr__Postgres__MainDb:
              valueFrom:
                secretKeyRef:
                  name: sonarr-pg
                  key: main_db
            Sonarr__Postgres__LogDb:
              valueFrom:
                secretKeyRef:
                  name: sonarr-pg
                  key: log_db
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 8989
                initialDelaySeconds: 30
                periodSeconds: 30
                timeoutSeconds: 10
                failureThreshold: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 8989
                initialDelaySeconds: 5
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 5
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 8989
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 60
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 2Gi

  service:
    sonarr:
      controller: sonarr
      ports:
        http:
          port: 8989

  persistence:
    config:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: media-plexmedia
      globalMounts:
        - path: /config
          subPath: Configs/sonarr
    tv:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: media-plexmedia
      globalMounts:
        - path: /tv
          subPath: TVShows
    downloads:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: media-plexmedia
      globalMounts:
        - path: /downloads
          subPath: Downloads
