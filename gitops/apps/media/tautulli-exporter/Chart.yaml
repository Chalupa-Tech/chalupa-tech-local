apiVersion: v2
name: tautulli-exporter
description: |
  Prometheus exporter for Tautulli — re-emits a small set of live Plex
  metrics (bandwidth in kbps + direct-play/direct-stream/transcode
  breakdown) that axsuul/plex-media-server-exporter does not expose.
  Complements the existing plex-exporter wrapper; the new Grafana
  dashboard "Tautulli — Bandwidth & Streams" sources from this exporter.

  Uses mm404/tautulli-exporter (Python, actively maintained on Docker
  Hub; source at github.com/mm503/tautulli-exporter). Reads the Tautulli
  API key from K8s Secret `tautulli-exporter`, which ESO syncs from
  OpenBao path tautulli/exporter. The Tautulli API key is generated by
  Tautulli on first install — operator copies it into OpenBao
  post-Tautulli-first-run; the exporter CrashLoops until then by design.
type: application
version: 0.1.0
appVersion: "0.2.4"
dependencies:
  - name: app-template
    version: 4.4.0
    repository: https://bjw-s-labs.github.io/helm-charts/
