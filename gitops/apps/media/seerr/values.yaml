app-template:
  defaultPodOptions:
    securityContext:
      runAsNonRoot: false
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch

  controllers:
    seerr:
      type: deployment
      replicas: 1
      strategy: Recreate
      containers:
        main:
          image:
            repository: ghcr.io/seerr-team/seerr
            tag: latest
          env:
            TZ: America/Los_Angeles
            LOG_LEVEL: info
            PORT: "5055"
            DB_TYPE: postgres
            DB_HOST: arrs-pg-rw.media.svc.cluster.local
            DB_PORT: "5432"
            DB_USER:
              valueFrom:
                secretKeyRef:
                  name: seerr-pg
                  key: username
            DB_PASS:
              valueFrom:
                secretKeyRef:
                  name: seerr-pg
                  key: password
            DB_NAME:
              valueFrom:
                secretKeyRef:
                  name: seerr-pg
                  key: db
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/v1/status
                  port: 5055
                initialDelaySeconds: 30
                periodSeconds: 30
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/v1/status
                  port: 5055
                initialDelaySeconds: 10
                periodSeconds: 10
            startup:
              enabled: false
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi

  service:
    seerr:
      controller: seerr
      ports:
        http:
          port: 5055

  persistence:
    config:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: media-plexmedia
      globalMounts:
        - path: /app/config
          subPath: Configs/seerr
