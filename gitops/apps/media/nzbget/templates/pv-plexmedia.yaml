apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-plexmedia
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: media-stack
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  capacity:
    storage: 10Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    # NFSv4.2 for sparse files / hole punching / server-side copy.
    - nfsvers=4.2
    # `hard` blocks on slow server instead of returning EIO. With the
    # previous `soft,timeo=150,retrans=5`, a 90-second NFS hiccup would
    # abort active reads — Plex would drop playback, NZBGet would error
    # mid-decode. `hard` retries until the server returns, which is the
    # correct semantic for media file I/O.
    - hard
    # Explicit 1 MiB block size (NFSv4 max). Modern kernels usually
    # negotiate this anyway, but pinning it removes guesswork.
    - rsize=1048576
    - wsize=1048576
    # nconnect=4 opens 4 parallel TCP connections per mount so NFS RPCs
    # distribute across them instead of serializing through one stream.
    # This is the single largest throughput win for any client doing
    # large sequential reads/writes (Plex direct stream, NZBGet decode,
    # *arr scans). Linux 5.3+ client; Talos and Ubuntu 24.04 both have it.
    - nconnect=4
    # Skip atime/diratime updates so reads don't generate stealth writes
    # back to the server (every Plex playback was triggering them).
    - noatime
    - nodiratime
  nfs:
    # TrueNAS's storage-subnet IP on vmbr1. Mounting via 10.10.10.40
    # instead of 192.168.1.40 keeps NFS traffic on the dedicated
    # internal bridge (jumbo MTU, no contention with vmbr0's mgmt+WAN
    # traffic). All workers have ens19/10.10.10.226-232 with routes to
    # this subnet; TrueNAS NFS export allows 10.10.10.0/24.
    server: 10.10.10.40
    path: /mnt/PlexMedia/frame
  claimRef:
    namespace: media
    name: media-plexmedia
