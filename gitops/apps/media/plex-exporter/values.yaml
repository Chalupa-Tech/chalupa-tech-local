app-template:
  controllers:
    plex-exporter:
      type: deployment
      replicas: 1
      strategy: RollingUpdate
      containers:
        main:
          image:
            repository: ghcr.io/axsuul/plex-media-server-exporter
            # 2.1.0 is the current stable. Earlier `v0.30.0` was an
            # invented tag (404 on ghcr). Verify with `gh api
            # repos/axsuul/plex-media-server-exporter/releases | jq '.[].tag_name'`.
            tag: "2.1.0"
          env:
            # Plex runs in the LXC at 192.168.1.224:32400 (outside the
            # cluster). The exporter pod reaches it via the worker node's
            # default route — no DNS, no service indirection, just LAN.
            PLEX_ADDR: http://192.168.1.224:32400
            PLEX_TOKEN:
              valueFrom:
                secretKeyRef:
                  name: plex-exporter
                  key: token
            # v2.x renamed METRICS_PORT → PORT (per upstream README).
            # METRICS_INTERVAL_SECONDS doesn't exist — removed.
            PORT: "9594"
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /metrics
                  port: 9594
                periodSeconds: 30
                initialDelaySeconds: 15
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /metrics
                  port: 9594
                periodSeconds: 10
                initialDelaySeconds: 5
            startup:
              enabled: false
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi

  service:
    main:
      controller: plex-exporter
      ports:
        http:
          port: 9594
