apiVersion: v2
name: arrs-pg-wrapper
description: |
  Wrapper chart for the shared arr-stack PostgreSQL Cluster (CNPG).
  Owns the Cluster CRD instance plus the ExternalSecrets that pull the
  superuser + per-app credentials from OpenBao. Five application
  users (sonarr, radarr, seerr, prowlarr, readmebook) and nine
  databases (sonarr_main, sonarr_log, radarr_main, radarr_log, seerr,
  prowlarr_main, prowlarr_log, readmebook_main, readmebook_log) are
  provisioned by the Cluster bootstrap.
type: application
version: 0.1.0
appVersion: "16"
