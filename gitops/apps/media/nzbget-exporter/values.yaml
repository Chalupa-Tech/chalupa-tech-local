app-template:
  controllers:
    nzbget-exporter:
      type: deployment
      replicas: 1
      strategy: RollingUpdate
      containers:
        main:
          image:
            # frebib's exporter is the actively-maintained NZBGet exporter
            # (mariusv/nzbget-exporter — sometimes cited — returns 404).
            repository: ghcr.io/frebib/nzbget-exporter
            tag: latest
          env:
            # NZBGet's Service ClusterIP, port 6789 (web/JSON-RPC).
            NZBGET_HOST: http://nzbget.media.svc.cluster.local:6789
            # NZBGet's JSON-RPC ControlUsername is "nzbget" (matches the
            # nzbget chart's NZBGET_USER env). The password comes from
            # the shared `nzbget-credentials` secret (owned by the
            # nzbget chart's ExternalSecret).
            NZBGET_USERNAME: nzbget
            NZBGET_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: nzbget-credentials
                  key: control-password
          probes:
            # frebib's exporter has no dedicated /healthz, so we probe
            # /metrics — but hitting /metrics triggers a full scrape of
            # NZBGet's JSON-RPC API. When NZBGet is busy (active
            # download, post-processing, large queue), the scrape can
            # take several seconds. Kubelet's default probe
            # timeoutSeconds is 1 — too tight, kills the pod ~every
            # 22 min in a restart loop (observed: 10 restarts in 3h41m).
            #
            # Bumped to 10s timeout, and stretched periodSeconds so we
            # don't generate excess scrape load just from probes:
            # readiness every 30s, liveness every 60s. failureThreshold
            # 3 means a transient slow scrape doesn't kill the pod —
            # 3 consecutive failures over 3 min before restart.
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /metrics
                  port: 9452
                periodSeconds: 60
                timeoutSeconds: 10
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /metrics
                  port: 9452
                periodSeconds: 30
                timeoutSeconds: 10
                failureThreshold: 3
            startup:
              enabled: false
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi

  service:
    main:
      controller: nzbget-exporter
      ports:
        http:
          port: 9452
