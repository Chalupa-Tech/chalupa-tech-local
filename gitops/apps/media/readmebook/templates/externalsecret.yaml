apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: readmebook-app
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: readmebook-app
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Assemble DATABASE_URL from the postgres/readmebook KV entry
        # so the password never lives in the chart or in git. The
        # password MUST be URL-safe (no @, :, /, ?, #, % chars) when
        # seeded into OpenBao — Prisma does not tolerate raw special
        # chars in the connection string.
        DATABASE_URL: "postgresql://{{ `{{ .pg_username }}` }}:{{ `{{ .pg_password }}` }}@arrs-pg-rw.media.svc.cluster.local:5432/{{ `{{ .pg_main_db }}` }}"
        JWT_SECRET: "{{ `{{ .jwt_secret }}` }}"
        JWT_REFRESH_SECRET: "{{ `{{ .jwt_refresh_secret }}` }}"
        CONFIG_ENCRYPTION_KEY: "{{ `{{ .config_encryption_key }}` }}"
  data:
    - secretKey: pg_username
      remoteRef:
        key: postgres/readmebook
        property: username
    - secretKey: pg_password
      remoteRef:
        key: postgres/readmebook
        property: password
    - secretKey: pg_main_db
      remoteRef:
        key: postgres/readmebook
        property: main_db
    - secretKey: jwt_secret
      remoteRef:
        key: readmebook/app
        property: jwt_secret
    - secretKey: jwt_refresh_secret
      remoteRef:
        key: readmebook/app
        property: jwt_refresh_secret
    - secretKey: config_encryption_key
      remoteRef:
        key: readmebook/app
        property: config_encryption_key
