---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sportarr-http
  namespace: media
  annotations:
    external-dns.alpha.kubernetes.io/target: "192.168.1.230"
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`sportarr.frame.chalupatech.com`)
      kind: Rule
      services:
        - name: sportarr
          port: 1867
      middlewares:
        - name: redirect-to-https
          namespace: media
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sportarr-https
  namespace: media
  annotations:
    external-dns.alpha.kubernetes.io/target: "192.168.1.230"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`sportarr.frame.chalupatech.com`)
      kind: Rule
      services:
        - name: sportarr
          port: 1867
  tls: {}
