apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default-pool
  namespace: metallb
  annotations:
    # Apply after CRDs created by the dependency chart.
    argocd.argoproj.io/sync-wave: "1"
spec:
  addresses:
    - 192.168.1.160-192.168.1.170
  autoAssign: true
  avoidBuggyIPs: true
