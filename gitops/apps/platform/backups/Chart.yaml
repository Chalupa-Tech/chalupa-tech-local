apiVersion: v2
name: backups-wrapper
description: |
  Cluster data backups foundation: the shared NFS backup volume on TrueNAS
  (Backups/k8s), a restic REST server that stores every PVC's restic
  repository on it, the VolSync operator (chart dependency) that drives
  the per-PVC ReplicationSources in platform/pvc-backups, and the restic
  repository password synced from OpenBao. See
  docs/2026-11-04-cluster-backups.md.
type: application
version: 0.1.0
appVersion: "0.17.0"
dependencies:
  - name: volsync
    version: 0.17.0
    repository: https://backube.github.io/helm-charts/
