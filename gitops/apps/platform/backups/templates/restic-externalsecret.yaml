# Restic repository password, seeded once in OpenBao at secret/backups/restic
# (property `password`) and read by the `backups-read` policy. Every PVC's
# ReplicationSource secret (platform/pvc-backups) is templated from this one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-repo-password
  namespace: backups
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: restic-repo-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: backups/restic
        property: password
