apiVersion: apps/v1
kind: Deployment
metadata:
  name: restic-rest
  namespace: backups
  labels:
    app.kubernetes.io/name: restic-rest
    app.kubernetes.io/part-of: backups
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: restic-rest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: restic-rest
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rest-server
          image: "{{ .Values.resticRest.image.repository }}:{{ .Values.resticRest.image.tag }}"
          args:
            - --path=/data
            - --listen=:8000
            - --no-auth
            - --prometheus
            - --prometheus-no-auth
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: restic
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: {{ .Values.resticRest.resources.requests.cpu }}
              memory: {{ .Values.resticRest.resources.requests.memory }}
            limits:
              memory: {{ .Values.resticRest.resources.limits.memory }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backups
---
apiVersion: v1
kind: Service
metadata:
  name: restic-rest
  namespace: backups
  labels:
    app.kubernetes.io/name: restic-rest
spec:
  selector:
    app.kubernetes.io/name: restic-rest
  ports:
    - name: http
      port: 8000
      targetPort: http
