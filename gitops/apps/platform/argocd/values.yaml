# ArgoCD self-managed values.
#
# RECOVERY: If a bad value here breaks ArgoCD itself, ArgoCD cannot reconcile
# the next change. Roll back the affected workloads. Note that the
# application-controller is a StatefulSet, not a Deployment — get the kind
# wrong and the rollout-undo command silently does nothing useful.
#
#   kubectl rollout undo deployment/argocd-server -n argocd
#   kubectl rollout undo deployment/argocd-repo-server -n argocd
#   kubectl rollout undo deployment/argocd-applicationset-controller -n argocd
#   kubectl rollout undo statefulset/argocd-application-controller -n argocd
#
# Or rerun deploy.yml — Stage 4's helm upgrade reapplies the bootstrap
# values from .github/argocd-bootstrap-values.yaml and resets the cluster
# to the bootstrap baseline; ArgoCD will then attempt to reconcile this
# file again, so fix it first.

argo-cd:
  global:
    logging:
      level: info
  configs:
    params:
      # TLS terminates at Traefik in sub-project #2; until then UI is
      # accessed via kubectl port-forward and runs in insecure mode.
      server.insecure: true
  server:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
  repoServer:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
  controller:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
  applicationSet:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
  notifications:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
