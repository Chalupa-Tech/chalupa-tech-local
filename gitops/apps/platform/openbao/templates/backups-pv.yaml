# PV onto the shared TrueNAS backups export (same path as platform/backups);
# a PVC can only bind a PV from its own namespace.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: backups-k8s-openbao
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: backups
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  capacity:
    storage: {{ .Values.snapshot.size }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.2
    - hard
    - rsize=1048576
    - wsize=1048576
    - noatime
    - nodiratime
  nfs:
    server: {{ .Values.snapshot.nfsServer }}
    path: {{ .Values.snapshot.nfsPath }}
  claimRef:
    namespace: openbao
    name: backups-k8s
