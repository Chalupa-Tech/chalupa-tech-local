apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups-k8s
  namespace: openbao
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: backups
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.snapshot.size }}
  storageClassName: ""
  volumeName: backups-k8s-openbao
