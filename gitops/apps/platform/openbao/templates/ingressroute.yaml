apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openbao-http
  namespace: openbao
  annotations:
    # external-dns target (Traefik's MetalLB LB IP). Required because
    # external-dns's traefik-proxy source silently skips IngressRoutes
    # without an explicit target.
    external-dns.alpha.kubernetes.io/target: "192.168.1.230"
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`openbao.frame.chalupatech.com`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
          namespace: traefik
      services:
        - name: openbao
          port: 8200
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openbao-https
  namespace: openbao
  annotations:
    external-dns.alpha.kubernetes.io/target: "192.168.1.230"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`openbao.frame.chalupatech.com`)
      kind: Rule
      services:
        - name: openbao
          port: 8200
  tls: {}
