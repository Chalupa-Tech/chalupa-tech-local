# --- OCI KMS auto-unseal (docs/2026-11-05-openbao-auto-unseal.md) ---
# Shared with the openbao subchart (its init container reads these via tpl).
# `enabled` is flipped to true ONLY by the seal-migration runbook, after the
# bootstrap secret `openbao-oci-kms` exists; `disabled: true` writes
# `disabled = "true"` into the seal block for a migration back to Shamir.
global:
  ociKms:
    enabled: true
    disabled: false
    plugin:
      # kms-oci plugin from openbao/openbao-plugins (release tag kms-oci-v<version>).
      # Renovate opens a PR for new releases but never automerges: update the
      # sha256 (checksums-kms-oci.txt, linux_amd64 tarball) in the same commit
      # and re-check openbao/go-kms-wrapping#163 (auth_type_api_key inverted in
      # wrapper >= v2.4) before merging.
      version: "0.1.1"
      sha256: "103735c5b9c14d28ba37bf9c8d7a96c686b1d3afa2c96580b5b0fe0f7a4e9059"
    secretName: openbao-oci-kms

openbao:
  server:
    # OCI KMS seal plugin: everything below is unconditional (the subchart
    # does not template its HCL or volume lists); the seal itself is switched
    # by global.ociKms.enabled through the init container (files/kms-init.sh),
    # which writes /openbao/kms/seal.hcl that the server loads via extraArgs.
    extraArgs: "-config=/openbao/kms/seal.hcl"
    extraInitContainers:
      - name: kms-init
        image: '{{ .Values.server.image.registry }}/{{ .Values.server.image.repository }}:{{ .Values.server.image.tag | default (trimPrefix "v" .Chart.AppVersion) }}'
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "/openbao/kms-init/kms-init.sh"]
        securityContext:
          allowPrivilegeEscalation: false
        env:
          - name: OCI_KMS_ENABLED
            value: "{{ .Values.global.ociKms.enabled }}"
          - name: OCI_KMS_DISABLED
            value: "{{ .Values.global.ociKms.disabled }}"
          - name: PLUGIN_VERSION
            value: "{{ .Values.global.ociKms.plugin.version }}"
          - name: PLUGIN_SHA256
            value: "{{ .Values.global.ociKms.plugin.sha256 }}"
          - name: KMS_DIR
            value: /openbao/kms
          - name: PLUGIN_CACHE_DIR
            value: /openbao/data/kms-cache
        # key_id / crypto_endpoint / management_endpoint (Terraform outputs)
        envFrom:
          - secretRef:
              name: "{{ .Values.global.ociKms.secretName }}"
              optional: true
        volumeMounts:
          - name: kms
            mountPath: /openbao/kms
          - name: kms-init
            mountPath: /openbao/kms-init
            readOnly: true
          # Verified tarball cache in a plain directory on this replica's data
          # PVC (next to raft/, not inside it): restarts need no GitHub access.
          # Deliberately no subPath: the kubelet creates subPath directories
          # root-owned 0755 and fsGroup is not applied to them, so uid 100
          # could not write the cache (observed 2026-11-05).
          - name: data
            mountPath: /openbao/data
    volumes:
      - name: kms
        emptyDir: {}
      - name: kms-init
        configMap:
          name: openbao-kms-init
          defaultMode: 0555
      # OCI SDK config + API private key (bootstrap secret, created by hand —
      # ESO cannot provide it: OpenBao is sealed when this is needed).
      - name: oci-config
        secret:
          secretName: openbao-oci-kms
          optional: true
          defaultMode: 0440
          items:
            - key: config
              path: config
            - key: key.pem
              path: key.pem
    volumeMounts:
      - name: kms
        mountPath: /openbao/kms
      # Nested inside the chart's `home` emptyDir (/home/openbao); the runtime
      # mounts parents before children regardless of list order.
      - name: oci-config
        mountPath: /home/openbao/.oci
        readOnly: true
    ha:
      enabled: true
      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = true
          api_addr = "http://HOSTNAME.openbao-internal:8200"
          cluster_addr = "http://HOSTNAME.openbao-internal:8201"
          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            telemetry {
              unauthenticated_metrics_access = "true"
            }
          }
          telemetry {
            prometheus_retention_time = "30s"
            disable_hostname = true
          }
          storage "raft" {
            path = "/openbao/data"
            retry_join {
              leader_api_addr = "http://openbao-0.openbao-internal:8200"
            }
            retry_join {
              leader_api_addr = "http://openbao-1.openbao-internal:8200"
            }
            retry_join {
              leader_api_addr = "http://openbao-2.openbao-internal:8200"
            }
          }
          service_registration "kubernetes" {}
    replicas: 3
    affinity: |
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - openbao
              topologyKey: kubernetes.io/hostname
    dataStorage:
      enabled: true
      size: 1Gi
      storageClass: local-path
    ui:
      enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
  serverTelemetry:
    serviceMonitor:
      enabled: true

# Hourly raft snapshots onto the TrueNAS backups export (templates/
# snapshot-cronjob.tpl, files/raft-snapshot.sh). One-time OpenBao setup:
# apply policy `snapshot` + create the Kubernetes auth role `openbao-snapshot`
# (scripts/openbao/policies/snapshot.hcl has the commands).
snapshot:
  # Same image as the servers (matching `bao` CLI). Keep the tag equal to the
  # version the chart deploys; Renovate tracks this repository/tag pair.
  image:
    repository: quay.io/openbao/openbao
    tag: "2.6.2"
  schedule: "5 * * * *"
  keep: 48
  nfsServer: 10.10.10.40
  nfsPath: /mnt/AppData/Backups/k8s
  size: 2Ti
