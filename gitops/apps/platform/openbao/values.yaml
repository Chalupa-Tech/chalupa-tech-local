openbao:
  server:
    ha:
      enabled: true
      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = true
          api_addr = "http://HOSTNAME.openbao-internal:8200"
          cluster_addr = "http://HOSTNAME.openbao-internal:8201"
          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            telemetry {
              unauthenticated_metrics_access = "true"
            }
          }
          telemetry {
            prometheus_retention_time = "30s"
            disable_hostname = true
          }
          storage "raft" {
            path = "/openbao/data"
            retry_join {
              leader_api_addr = "http://openbao-0.openbao-internal:8200"
            }
            retry_join {
              leader_api_addr = "http://openbao-1.openbao-internal:8200"
            }
            retry_join {
              leader_api_addr = "http://openbao-2.openbao-internal:8200"
            }
          }
          service_registration "kubernetes" {}
    replicas: 3
    affinity: |
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - openbao
              topologyKey: kubernetes.io/hostname
    dataStorage:
      enabled: true
      size: 1Gi
      storageClass: local-path
    ui:
      enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
  serverTelemetry:
    serviceMonitor:
      enabled: true

# Hourly raft snapshots onto the TrueNAS backups export (templates/
# snapshot-cronjob.tpl, files/raft-snapshot.sh). One-time OpenBao setup:
# apply policy `snapshot` + create the Kubernetes auth role `openbao-snapshot`
# (scripts/openbao/policies/snapshot.hcl has the commands).
snapshot:
  # Same image as the servers (matching `bao` CLI). Keep the tag equal to the
  # version the chart deploys; Renovate tracks this repository/tag pair.
  image:
    repository: quay.io/openbao/openbao
    tag: "2.6.2"
  schedule: "5 * * * *"
  keep: 48
  nfsServer: 10.10.10.40
  nfsPath: /mnt/AppData/Backups/k8s
  size: 2Ti
