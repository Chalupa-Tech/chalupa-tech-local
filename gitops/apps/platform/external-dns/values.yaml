external-dns:
  provider:
    name: cloudflare
  sources:
    - traefik-proxy
  # frame.chalupatech.com is a subdomain inside the chalupatech.com zone
  # (Cloudflare free tier doesn't support sub-zone delegation), so the filter
  # has to match the actual zone. txtOwnerId + txtPrefix below ensure
  # external-dns only manages records it created, so broader filter is safe.
  domainFilters:
    - chalupatech.com
  policy: upsert-only
  registry: txt
  txtOwnerId: "chalupa-talos"
  txtPrefix: "_edns."
  interval: 1m
  env:
    - name: CF_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: cloudflare-api-token
          key: token
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi
