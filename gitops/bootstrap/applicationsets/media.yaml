apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: media-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/Chalupa-Tech/chalupa-tech-local
        revision: main
        directories:
          - path: gitops/apps/media/*
  template:
    metadata:
      name: '{{.path.basename}}'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/Chalupa-Tech/chalupa-tech-local
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: media
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
      # Silence false-positive drift from admission-controller field
      # defaulters. Same block as platform.yaml so the media tier's
      # forthcoming ExternalSecret resources do not show 'OutOfSync but
      # Healthy' on first sync. Fields empirically observed (2026-05-07)
      # on cert-manager / external-dns ExternalSecrets.
      ignoreDifferences:
        - group: external-secrets.io
          kind: ExternalSecret
          jsonPointers:
            - /spec/target/deletionPolicy
          jqPathExpressions:
            - .spec.data[].remoteRef.conversionStrategy
            - .spec.data[].remoteRef.decodingStrategy
            - .spec.data[].remoteRef.metadataPolicy
            - .spec.data[].remoteRef.nullBytePolicy
        - group: postgresql.cnpg.io
          kind: Cluster
          jsonPointers:
            - /spec/enablePDB
            - /spec/enableSuperuserAccess
            - /spec/failoverDelay
            - /spec/logLevel
            - /spec/maxSyncReplicas
            - /spec/minSyncReplicas
            - /spec/monitoring
            - /spec/postgresGID
            - /spec/postgresUID
            - /spec/postgresql
            - /spec/primaryUpdateMethod
            - /spec/primaryUpdateStrategy
            - /spec/probes
            - /spec/replicationSlots
            - /spec/smartShutdownTimeout
            - /spec/startDelay
            - /spec/stopDelay
            - /spec/switchoverDelay
            - /spec/bootstrap/initdb/encoding
            - /spec/bootstrap/initdb/localeCType
            - /spec/bootstrap/initdb/localeCollate
            - /spec/storage/resizeInUseVolumes
          jqPathExpressions:
            - .spec.managed.roles[].inherit
